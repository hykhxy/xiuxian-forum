<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发表帖子 · 灵墟论道</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-nav"></header>

  <main class="container page">
    <div class="card" style="max-width:760px;margin:0 auto">
      <div class="page-head">
        <div class="page-title" id="page-title">发表新帖</div>
        <div class="page-sub" id="page-sub">发帖可得修为 +10</div>
      </div>

      <form id="post-form">
        <div class="form-row">
          <div class="form-item">
            <label>板块</label>
            <select id="category"></select>
          </div>
          <div class="form-item">
            <label>标签（选填，逗号分隔，最多 5 个）</label>
            <input type="text" id="tags" placeholder="例如：新手, 灵气, 炼丹">
          </div>
        </div>
        <div class="form-item">
          <label>标题（50 字内）</label>
          <input type="text" id="title" maxlength="50" placeholder="一句话点明主旨">
        </div>
        <div class="form-item">
          <label>正文（10000 字内）</label>
          <textarea id="content" style="min-height:260px" maxlength="10000" placeholder="大道玄机，尽书于此……"></textarea>
        </div>
        <div class="editor-toolbar">
          <button type="submit" class="btn btn-primary" id="submit-btn">发布</button>
          <a class="btn" href="posts.html">返回论道台</a>
          <span class="char-count" id="char-count"></span>
        </div>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/post-edit.js"></script>
</body>
</html>
