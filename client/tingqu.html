<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>听曲 · 灵墟论道</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-nav"></header>

  <main class="container page">
    <!-- 中央搜索区（视频背景 + 双层遮罩之上） -->
    <section class="tq-hero">
      <div class="dx-title">听 曲</div>
      <div class="dx-sub">一曲仙音 · 涤荡尘心</div>

      <div class="tq-search-wrap">
        <input type="text" id="tq-input" class="tq-input" placeholder="输入歌名或歌手，如「稻香」「周杰伦」…">
        <button class="btn btn-primary" id="tq-search-btn">寻 曲</button>
      </div>

      <!-- 搜索结果列表：歌名 + 歌手，点击即播（播放交给 MetingJS 组件） -->
      <div class="tq-results" id="tq-results"></div>
    </section>
  </main>

  <!-- 底部播放器：方案A <meting-js>（动态注入），加载失败自动降级方案B 官方 iframe -->
  <div id="tq-player">
    <div id="tq-mode-tip" class="tq-mode-tip"></div>
    <div id="tq-meting-box"></div>
    <div id="tq-iframe-box"></div>
  </div>

  <!-- 关闭全局播放栏（本页自带播放器），再加载公共脚本（player.js 仍负责注入全站视频背景） -->
  <script>window.DX_PLAYER_OFF = true;</script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/pages/tingqu.js"></script>
</body>
</html>
