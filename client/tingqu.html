<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>听曲 · 灵墟论道</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="tq-dark">
  <header id="site-nav"></header>

  <main class="container page">
    <!-- 中央搜索区 -->
    <section class="tq-hero">
      <div class="dx-title">听 曲</div>
      <div class="dx-sub">一曲仙音 · 涤荡尘心</div>

      <div class="tq-search-wrap">
        <input type="text" id="tq-input" class="tq-input" placeholder="输入歌名或歌手，如「稻香」「周杰伦」…">
        <button class="btn btn-primary" id="tq-search-btn">寻 曲</button>
      </div>

      <!-- 搜索结果容器：保持为空，由 JS 动态插入（无任何演示数据） -->
      <div id="search-results" class="tq-results"></div>
    </section>
  </main>

  <!-- MetingJS 播放器容器（组件由 JS 动态注入，fixed 吸底模式） -->
  <div id="player-container"></div>

  <!-- 关闭全局播放栏（本页用 MetingJS 组件），再加载公共脚本（player.js 仍注入全站视频背景，本页由 CSS 隐藏） -->
  <script>window.DX_PLAYER_OFF = true;</script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/pages/tingqu.js"></script>
</body>
</html>
