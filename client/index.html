<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵墟论道 · 修仙论坛</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-nav"></header>

  <main class="container page">
    <div class="filter-bar">
      <div class="filter-tabs" id="category-tabs"></div>
      <input type="text" id="keyword" placeholder="搜索帖子…" style="max-width:220px">
      <select id="sort" style="max-width:120px">
        <option value="new">最新</option>
        <option value="hot">最热</option>
      </select>
      <label style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer">
        <input type="checkbox" id="essence" style="width:auto"> 仅看精华
      </label>
    </div>

    <div id="post-list" class="post-list"></div>
    <div class="pagination" id="pagination"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/index.js"></script>
</body>
</html>
