<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入道 · 灵墟论道</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 全屏留白：竖排书法宗门名 + 卷轴令牌 -->
  <div class="auth-scene">
    <div class="auth-title">
      <div class="sect">灵墟论道</div>
      <div class="sect-slogan">云深不知处 · 一步一登仙</div>
    </div>

    <div class="scroll-token card">
      <i class="ff"></i><i class="ff"></i>
      <div class="token-head">入 道 令</div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login">登 录</div>
        <div class="auth-tab" id="tab-register">拜 入 山 门</div>
      </div>

      <!-- 登录 -->
      <form id="form-login">
        <div class="form-item">
          <label>道号</label>
          <input type="text" id="login-account" placeholder="输入用户名" autocomplete="username">
        </div>
        <div class="form-item">
          <label>口令</label>
          <input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">踏 入 灵 墟</button>
      </form>

      <!-- 注册 -->
      <form id="form-register" style="display:none">
        <div class="form-item">
          <label>道号（2-16 字符）</label>
          <input type="text" id="reg-username" placeholder="行走修真界的名号" autocomplete="off">
        </div>
        <div class="form-item">
          <label>口令（至少 6 位）</label>
          <input type="password" id="reg-password" placeholder="设置密码" autocomplete="new-password">
        </div>
        <div class="form-item">
          <label>选择职业（终身不可更改）</label>
          <select id="reg-profession">
            <option value="">— 请选择职业 —</option>
          </select>
          <div class="form-hint" id="profession-hint">职业决定修行方向，请慎重抉择</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="register-submit">开 辟 道 途</button>
      </form>

      <div class="auth-hint">新晋道友赠 100 灵石 · 可往藏经阁抽取功法</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
